name: Build Windows exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bleak PySide6 pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name AirPodsPopup airpods_popup.py
      - uses: actions/upload-artifact@v4
        with:
          name: AirPodsPopup
          path: dist/AirPodsPopup.exe
